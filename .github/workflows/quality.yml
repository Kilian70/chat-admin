name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["8.2", "8.3"]' || '["8.2"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate module.json
        run: |
          php -r '
            $data = json_decode(file_get_contents("module.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (["id","name","version","humhub"] as $key) {
              if (!array_key_exists($key, $data)) { fwrite(STDERR, "Missing module.json field: $key\n"); exit(1); }
            }
            if (empty($data["humhub"]["minVersion"])) { fwrite(STDERR, "Missing humhub.minVersion\n"); exit(1); }
            if (!preg_match("/^\\d+\\.\\d+\\.\\d+(?:[-+][0-9A-Za-z.-]+)?$/", $data["version"])) { fwrite(STDERR, "Invalid version\n"); exit(1); }
          '
      - name: Lint PHP files
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Run policy and version regression tests
        run: |
          php tests/run.php
          php tests/access.php
